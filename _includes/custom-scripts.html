<script>
  (function() {
    // ---- Create canvas ----
    const canvas = document.createElement('canvas');
    canvas.id = 'starCanvas';
    document.body.prepend(canvas); // place it as first child so it stays behind

    // ---- Create toggle button ----
    const toggleBtn = document.createElement('button');
    toggleBtn.id = 'themeToggle';
    toggleBtn.className = 'theme-toggle';
    toggleBtn.setAttribute('aria-label', 'Toggle theme');
    toggleBtn.textContent = '🌙';
    document.body.appendChild(toggleBtn);

    // ---- Add required CSS (or you can keep it in your existing stylesheet) ----
    const style = document.createElement('style');
    style.textContent = `
      /* Canvas positioning */
      #starCanvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }

      /* Dark theme (default) */
      body.theme-dark {
        background: radial-gradient(circle at 30% 40%, #0a0f2a, #01010f);
        color: #f0f0f0;
      }

      body.theme-light {
        background: linear-gradient(145deg, #f8fafc, #e2e8f0);
        color: #1e2a3a;
      }

      body.theme-light #starCanvas {
        opacity: 0;
        visibility: hidden;
      }

      /* Toggle button */
      .theme-toggle {
        position: fixed;
        top: 1rem;
        right: 1rem;
        background: none;
        border: none;
        font-size: 1.5rem;
        cursor: pointer;
        padding: 0.5rem;
        border-radius: 50%;
        transition: background 0.2s;
        z-index: 10;
      }
      .theme-toggle:hover {
        background: rgba(128, 128, 128, 0.2);
        transform: scale(1.05);
      }

      /* Ensure links are visible in dark mode */
      body.theme-dark a {
        color: #8bb9ff;
      }
      body.theme-dark a:hover {
        color: #b0d0ff;
      }

      /* Keep original theme's responsive behaviour - no need to override .wrapper */
    `;
    document.head.appendChild(style);
            
        // ----- Configuration -----
        const BASE_STAR_COUNT = 160;
        const MIN_STAR_COUNT = 80;
        const MAX_STAR_COUNT = 200;
        const LIFESPAN_RANGE = [3, 8];

        //const canvas = document.getElementById('starCanvas');
        const ctx = canvas.getContext('2d');

        let stars = [];
        let animationFrameId = null;
        let lastTimestamp = 0;
        let isDarkMode = true;

        // ----- Star shape drawing -----
        function drawStar(ctx, x, y, outerR, innerR, points, rotation) {
            const step = Math.PI / points;
            const rot = rotation * Math.PI / 180;
            ctx.beginPath();
            for (let i = 0; i < 2 * points; i++) {
            const r = (i % 2 === 0) ? outerR : innerR;
            const angle = i * step + rot;
            const px = x + r * Math.cos(angle);
            const py = y + r * Math.sin(angle);
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
        }

        // ----- Star creation -----
        function createStar(width, height) {
            const edges = [3, 4, 5][Math.floor(Math.random() * 3)];
            const outerRadius = Math.random() * 1.8 + 0.8;
            const innerRadiusFactor = Math.random() * 0.6 + 0.3;
            return {
            x: Math.random() * width,
            y: Math.random() * height,
            outerRadius: outerRadius,
            innerRadius: outerRadius * (0.3 + innerRadiusFactor * 0.6),
            edges: edges,
            rotation: Math.random() * 360,
            lifespan: LIFESPAN_RANGE[0] + Math.random() * (LIFESPAN_RANGE[1] - LIFESPAN_RANGE[0]),
            age: 0
            };
        }

        // ----- Adaptive star count -----
        function getAdaptiveStarCount() {
            const area = window.innerWidth * window.innerHeight;
            const pixelRatio = window.devicePixelRatio || 1;
            const raw = BASE_STAR_COUNT * (area / (1920 * 1080)) * Math.min(pixelRatio, 1.5);
            return Math.min(MAX_STAR_COUNT, Math.max(MIN_STAR_COUNT, Math.floor(raw)));
        }

        function initStars(width, height) {
            const count = getAdaptiveStarCount();
            stars = [];
            for (let i = 0; i < count; i++) {
            stars.push(createStar(width, height));
            }
        }

        // ----- Resize handling -----
        let resizeTimeout;
        function onResize() {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            for (let s of stars) {
                s.age = 0; // force reposition
            }
            }, 100);
        }

        // ----- Update stars (delta time) -----
        function updateStars(deltaSec) {
            for (let s of stars) {
            s.age += deltaSec;
            if (s.age >= s.lifespan) {
                s.x = Math.random() * canvas.width;
                s.y = Math.random() * canvas.height;
                s.outerRadius = Math.random() * 1.8 + 0.8;
                const innerFactor = Math.random() * 0.6 + 0.3;
                s.innerRadius = s.outerRadius * (0.3 + innerFactor * 0.6);
                s.edges = [3, 4, 5][Math.floor(Math.random() * 3)];
                s.rotation = Math.random() * 360;
                s.lifespan = LIFESPAN_RANGE[0] + Math.random() * (LIFESPAN_RANGE[1] - LIFESPAN_RANGE[0]);
                s.age = 0;
            }
            }
        }

        // ----- Draw stars -----
        function drawStars(now) {
            if (!isDarkMode) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let s of stars) {
            const t = s.age / s.lifespan;
            let alpha = Math.sin(Math.PI * t);
            alpha = Math.min(0.95, Math.max(0.08, alpha));

            if (alpha > 0.85) {
                drawStar(ctx, s.x, s.y, s.outerRadius, s.innerRadius, s.edges, s.rotation);
                ctx.fillStyle = `rgba(255, 240, 210, ${alpha})`;
                ctx.fill();
                if (alpha > 0.92) {
                ctx.shadowBlur = 3;
                ctx.shadowColor = 'rgba(255, 200, 100, 0.6)';
                drawStar(ctx, s.x, s.y, s.outerRadius, s.innerRadius, s.edges, s.rotation);
                ctx.fill();
                ctx.shadowBlur = 0;
                }
            } else {
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.outerRadius * 0.9, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 240, 210, ${alpha})`;
                ctx.fill();
            }
            }
        }

        // ----- Animation loop -----
        function animate(timestamp) {
            if (!isDarkMode) {
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
            return;
            }

            if (!lastTimestamp) {
            lastTimestamp = timestamp;
            animationFrameId = requestAnimationFrame(animate);
            return;
            }

            const delta = Math.min(0.1, (timestamp - lastTimestamp) / 1000);
            lastTimestamp = timestamp;

            updateStars(delta);
            drawStars(timestamp);

            animationFrameId = requestAnimationFrame(animate);
        }

        function startAnimation() {
            if (animationFrameId) return;
            lastTimestamp = 0;
            animationFrameId = requestAnimationFrame(animate);
        }

        // ----- Theme handling -----
        function setTheme(theme) {
            document.body.classList.remove('theme-dark', 'theme-light');
            document.body.classList.add(`theme-${theme}`);
            isDarkMode = (theme === 'dark');

            const toggleBtn = document.getElementById('themeToggle');
            if (toggleBtn) toggleBtn.textContent = theme === 'dark' ? '🌙' : '☀️';

            if (isDarkMode) {
            canvas.style.opacity = '1';
            canvas.style.visibility = 'visible';
            startAnimation();
            } else {
            canvas.style.opacity = '0';
            canvas.style.visibility = 'hidden';
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
            }
        }

        function getDefaultTheme() {
            const hour = new Date().getHours();
            return (hour >= 6 && hour < 18) ? 'light' : 'dark';
        }

        function loadTheme() {
            const storedTheme = localStorage.getItem('userTheme');
            const override = localStorage.getItem('override') === 'true';
            const theme = (override && storedTheme) ? storedTheme : getDefaultTheme();
            setTheme(theme);
        }

        function toggleTheme() {
            const newTheme = isDarkMode ? 'light' : 'dark';
            setTheme(newTheme);
            localStorage.setItem('override', 'true');
            localStorage.setItem('userTheme', newTheme);
        }

        // ----- Initialization -----
        window.addEventListener('load', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initStars(canvas.width, canvas.height);

            loadTheme();
            startAnimation();

            window.addEventListener('resize', onResize);

            const toggleBtn = document.getElementById('themeToggle');
            if (toggleBtn) toggleBtn.addEventListener('click', toggleTheme);
  });
})();
</script>
