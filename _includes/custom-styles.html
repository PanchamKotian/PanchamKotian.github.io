<style>
  /* Canvas positioning */
  #starCanvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  /* Dark theme (default) */
  body.theme-dark {
    background: radial-gradient(circle at 30% 40%, #0a0f2a, #01010f);
    color: #f0f0f0;
  }
  body.theme-dark .wrapper {
    background: rgba(10, 15, 40, 0.7);
    backdrop-filter: blur(12px);
    border-radius: 2rem;
    padding: 2rem;
    box-shadow: 0 0 20px rgba(0, 20, 80, 0.5);
  }

  /* Light theme */
  body.theme-light {
    background: linear-gradient(145deg, #f8fafc, #e2e8f0);
    color: #1e2a3a;
  }
  body.theme-light #starCanvas {
    opacity: 0;
    visibility: hidden;
  }
  body.theme-light .wrapper {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(12px);
    border-radius: 2rem;
    padding: 2rem;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
  }

  /* Toggle button */
  .theme-toggle {
    position: fixed;
    top: 1rem;
    right: 1rem;
    background: none;
    border: none;
    font-size: 1.5rem;
    cursor: pointer;
    padding: 0.5rem;
    border-radius: 50%;
    transition: background 0.2s;
    z-index: 10;
  }
  .theme-toggle:hover {
    background: rgba(128, 128, 128, 0.2);
    transform: scale(1.05);
  }
    /* Ensure the wrapper fully wraps its content */
    .wrapper {
    overflow: auto;          /* or overflow: hidden; but auto is safer */
    display: block;          /* already block, but be explicit */
    }

    /* If the heading is inline, change it to block */
    h1 {
    display: block;
    clear: both;
    }
  /* Links in dark mode */
  body.theme-dark a {
    color: #8bb9ff;
  }
  body.theme-dark a:hover {
    color: #b0d0ff;
  }

  /* Responsive: let the theme handle it */
  @media (max-width: 768px) {
    .wrapper {
      margin: 1rem;
    }
  }

  /* Reduce motion */
  @media (prefers-reduced-motion: reduce) {
    #starCanvas {
      display: none;
    }
  }
</style>
